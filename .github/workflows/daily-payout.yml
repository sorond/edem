name: daily-payout
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
jobs:
  payout:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke daily payout
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.DAILY_PAYOUT_SECRET }}" \
            "${{ secrets.SUPABASE_URL }}/functions/v1/daily-payout"
