<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЭДЕМ</title>
  <link rel="stylesheet" href="./assets/terminal.css">
  <script type="importmap">
  { "imports": { "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm" } }
  </script>
</head>
<body>
  <div class="boot" id="boot" role="status" aria-label="Загрузка системы">
    <div class="boot__log" id="boot-log"></div>
    <div class="boot__hint">[ ESC / ЛЮБАЯ КЛАВИША / КЛИК ] ПРОПУСТИТЬ ЗАГРУЗКУ</div>
  </div>
  <script>
    setTimeout(function () {
      var boot = document.getElementById('boot')
      if (boot) boot.remove()
    }, 8000)
  </script>
  <div class="scanlines" aria-hidden="true"></div>
  <header class="header">
    <div class="logo">ЭДЕМ</div>
    <div class="statusline"><span data-session>ТЕРМИНАЛ 01 · ПОДКЛЮЧЕНО</span> · <span data-clock></span></div>
    <nav class="nav" data-nav aria-label="Навигация">
      <a class="nav__link" data-route="#/home" href="#/home">ГЛАВНАЯ</a>
      <a class="nav__link" data-route="#/reports" href="#/reports">РАПОРТЫ</a>
      <a class="nav__link" data-route="#/history" href="#/history">ИСТОРИЯ</a>
      <a class="nav__link" data-route="#/admin" data-admin-link href="#/admin" hidden>АДМИНКА</a>
    </nav>
  </header>
  <main id="app" class="app"></main>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <div class="console" id="terminal-console" hidden>
    <div class="console__log" id="console-log" role="log" aria-live="polite">
      <div>ЭДЕМ СЕРВИСНЫЙ ТЕРМИНАЛ · ВВЕДИТЕ <b>HELP</b></div>
    </div>
    <div class="console__row">
      <span class="console__prompt">&gt;</span>
      <input class="console__input" id="console-input" type="text" autocomplete="off" spellcheck="false" placeholder="КОМАНДА..." aria-label="Команда терминала">
    </div>
  </div>
  <button class="console-toggle" id="console-toggle" type="button" aria-expanded="false" aria-controls="terminal-console">[&gt;_ КОНСОЛЬ]</button>
  <script type="module" src="./src/terminal-fx.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
